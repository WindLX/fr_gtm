[project]
name = "fr_gtm"
version = "0.1.0"
description = "Generic Transport Model for the FlyRuler simulation framework"
readme = "README.md"
authors = [{ name = "windlx", email = "1418043337@qq.com" }]
requires-python = ">=3.12"
dependencies = [
    "fly-ruler",
    "numpy",
    "pydantic>=2.13.4",
    "rtoml>=0.13.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
jax = ["jax>=0.8.2", "fly-ruler[jax]"]
jax-cuda12 = ["fly-ruler[jax-cuda12]"]
jax-cuda13 = ["fly-ruler[jax-cuda13]"]
all = ["fr-gtm[jax]"]

[tool.uv.sources]
"fly-ruler" = { workspace = true }

[dependency-groups]
dev = ["mypy>=2.0.0", "pytest>=9.0.2", "ruff>=0.11.0"]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

# --- Linting & Formatting (Ruff) ---
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "SIM"
] # Style, Errors, Import sort, Bugbear, Simplification
ignore = []

[tool.ruff.format]
quote-style = "double"

# --- Testing (Pytest) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

# --- Type Checking (MyPy) ---
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/fr_gtm", "tests", "examples"]
exclude = ["tests/generate_gtm_backend_reference.py"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["fly_ruler_proto_python", "fly_stick", "jax", "jax.*"]
ignore_missing_imports = true
